<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shkarpetky & Труси - Стильний Магазин</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f8f9fa; color: #333; }
        header { background: linear-gradient(135deg, #ff6b6b, #4ecdc4); color: white; padding: 2rem; text-align: center; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .products { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        .product { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .product img { width: 100%; height: 200px; object-fit: cover; }
        .info { padding: 15px; }
        button { background: #ff6b6b; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>
    <header>
        <h1>🧦 Шкарпетки & Труси</h1>
        <p>Стильна білизна для кожного дня</p>
    </header>
    <div class="container">
        <h2>Популярні товари</h2>
        <div class="products">
            <div class="product">
                <img src="https://picsum.photos/300/200?random=1" alt="Носки">
                <div class="info">
                    <h3>Комплект стильних носків</h3>
                    <p>299 грн</p>
                    <button>Купити</button>
                </div>
            </div>
            <div class="product">
                <img src="https://picsum.photos/300/200?random=2" alt="Труси">
                <div class="info">
                    <h3>Боксери преміум</h3>
                    <p>449 грн</p>
                    <button>Купити</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
