    <!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shkarpetky & Труси — Магазин білизни</title>
    <style>
        body { font-family: Arial, Helvetica, sans-serif; margin: 0; background: #f4f4f4; }
        header { background: linear-gradient(135deg, #ff6b6b, #4ecdc4); color: white; padding: 25px; text-align: center; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .products { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; }
        .product { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .product img { width: 100%; height: 320px; object-fit: cover; }
        .info { padding: 15px; text-align: center; }
        button { border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-size: 16px; }

        /* Кошик Rozetka стиль */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.75); z-index: 3000; }
        .cart-modal { background: white; width: 95%; max-width: 950px; margin: 30px auto; border-radius: 12px; max-height: 90vh; overflow-y: auto; }
        .cart-header { padding: 20px 25px; border-bottom: 2px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        .cart-item { display: flex; padding: 20px 25px; border-bottom: 1px solid #eee; align-items: center; gap: 15px; }
        .cart-item img { width: 90px; height: 90px; object-fit: cover; border-radius: 8px; }
        .quantity-btn { width: 32px; height: 32px; background: #eee; border-radius: 50%; font-size: 18px; }
        .total-bar { padding: 20px 25px; background: #f8f9fa; text-align: right; font-size: 1.3em; font-weight: bold; }
    </style>
</head>
<body>
    <header>
        <h1>🧦 Шкарпетки & Труси</h1>
        <p>Якісна та комфортна білизна</p>
    </header>

    <div class="container">
        <h2>Популярні товари</h2>
        <div class="products">

            <div class="product">
                <img src="https://raw.githubusercontent.com/dakalgf1-arch/socks-and-underwear-store/main/trusiki1.jpg" alt="Жіночі трусики">
                <div class="info">
                    <h3>Жіночі трусики (сліпи)</h3>
                    <p><strong>449 грн</strong></p>
                    <button onclick="addToCart(0)" style="background:#ff4757;color:white;width:100%;">Купити</button>
                </div>
            </div>

            <div class="product">
                <img src="https://raw.githubusercontent.com/dakalgf1-arch/socks-and-underwear-store/main/trusiki2.jpg" alt="Жіночі трусики">
                <div class="info">
                    <h3>Жіночі трусики (висока посадка)</h3>
                    <p><strong>479 грн</strong></p>
                    <button onclick="addToCart(1)" style="background:#ff4757;color:white;width:100%;">Купити</button>
                </div>
            </div>

        </div>
    </div>

    <!-- Кошик -->
    <div class="modal" id="cartModal">
        <div class="cart-modal">
            <div class="cart-header">
                <h2>🛒 Ваш кошик (<span id="cart-count">0</span>)</h2>
                <button onclick="closeCart()" style="font-size:30px;background:none;border:none;cursor:pointer;">✕</button>
            </div>
            
            <div id="cart-items"></div>
            
            <div class="total-bar">
                Разом: <span id="cart-total">0</span> грн<br><br>
                <button onclick="showOrderForm()" style="background:#27ae60;color:white;padding:15px 40px;font-size:18px;">Оформити замовлення</button>
                <button onclick="closeCart()" style="background:#95a5a6;color:white;padding:15px 30px;font-size:18px;margin-left:10px;">Продовжити покупки</button>
            </div>
        </div>
    </div>

    <!-- Форма замовлення -->
    <div class="modal" id="orderModal">
        <div style="background:white; margin:40px auto; padding:30px; width:90%; max-width:500px; border-radius:12px;">
            <h2>Оформлення замовлення</h2>
            <form onsubmit="submitOrder(event)">
                <div id="modal-products" style="margin:15px 0;"></div>
                <input type="text" placeholder="Ваше ім'я" required style="width:100%; padding:12px; margin:8px 0;"><br>
                <input type="tel" value="+380995461915" required style="width:100%; padding:12px; margin:8px 0;"><br>
                <input type="text" placeholder="Адреса доставки" required style="width:100%; padding:12px; margin:8px 0;"><br>
                <button type="submit" style="background:#27ae60;color:white;width:100%;padding:15px;font-size:17px;">Надіслати замовлення</button>
                <button type="button" onclick="closeOrderModal()" style="background:#95a5a6;color:white;width:100%;padding:15px;margin-top:10px;">Скасувати</button>
            </form>
        </div>
    </div>

    <script>
        let cart = [];
        const products = [
            {id: 0, name: "Жіночі трусики (сліпи)", price: 449, img: "https://raw.githubusercontent.com/dakalgf1-arch/socks-and-underwear-store/main/trusiki1.jpg"},
            {id: 1, name: "Жіночі трусики (висока посадка)", price: 479, img: "https://raw.githubusercontent.com/dakalgf1-arch/socks-and-underwear-store/main/trusiki2.jpg"}
        ];

        function addToCart(id) {
            const product = products.find(p => p.id === id);
            const existing = cart.find(item => item.id === id);
            
            if (existing) {
                existing.quantity += 1;
            } else {
                cart.push({...product, quantity: 1});
            }
            
            alert(product.name + " додано в кошик!");
            updateCart();
        }

        function updateCart() {
            const itemsDiv = document.getElementById('cart-items');
            itemsDiv.innerHTML = '';
            let total = 0;

            cart.forEach((item, index) => {
                total += item.price * item.quantity;
                itemsDiv.innerHTML += `
                    <div class="cart-item">
                        <img src="\( {item.img}" alt=" \){item.name}">
                        <div style="flex:1">
                            <strong>${item.name}</strong><br>
                            ${item.price} грн
                        </div>
                        <div style="text-align:center;">
                            <button class="quantity-btn" onclick="changeQty(${index}, -1)">–</button>
                            <span style="display:inline-block; min-width:30px;">${item.quantity}</span>
                            <button class="quantity-btn" onclick="changeQty(${index}, 1)">+</button>
                        </div>
                        <button onclick="removeFromCart(${index})" style="background:#e74c3c; color:white; padding:8px 12px; margin-left:15px;">Видалити</button>
                    </div>
                `;
            });

            document.getElementById('cart-count').textContent = cart.length;
            document.getElementById('cart-total').textContent = total;
        }

        function changeQty(index, delta) {
            cart[index].quantity += delta;
            if (cart[index].quantity < 1) cart[index].quantity = 1;
            updateCart();
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCart();
        }

        function openCart() {
            updateCart();
            document.getElementById('cartModal').style.display = 'block';
        }

        function closeCart() {
            document.getElementById('cartModal').style.display = 'none';
        }

        function showOrderForm() {
            if (cart.length === 0) return alert("Кошик порожній!");
            const list = cart.map(item => `• ${item.name} — \( {item.quantity} шт ( \){item.price * item.quantity} грн)`).join('<br>');
            document.getElementById('modal-products').innerHTML = `<strong>Ваше замовлення:</strong><br>${list}`;
            document.getElementById('orderModal').style.display = 'block';
        }

        function closeOrderModal() {
            document.getElementById('orderModal').style.display = 'none';
        }

        function submitOrder(e) {
            e.preventDefault();
            alert("✅ Дякуємо! Ваше замовлення прийнято. Ми скоро зв'яжемося з вами.");
            cart = [];
            closeOrderModal();
            closeCart();
        }
    </script>
</body>
</html>
