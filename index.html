<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shkarpetky & Труси</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f8f9fa; }
        header { background: linear-gradient(135deg, #ff6b6b, #4ecdc4); color: white; padding: 25px; text-align: center; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .products { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; }
        .product { background: white; border-radius: 15px; overflow: hidden; box-shadow: 0 5px 20px rgba(0,0,0,0.1); }
        .product img { width: 100%; height: 300px; object-fit: cover; }
        .info { padding: 15px; text-align: center; }
        button { background: #ff4757; color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; margin: 5px; }
        .cart { position: fixed; top: 20px; right: 20px; background: white; padding: 15px; border-radius: 12px; box-shadow: 0 5px 25px rgba(0,0,0,0.2); min-width: 300px; z-index: 1000; }
        .clear-btn { background: #e74c3c; }
    </style>
</head>
<body>
    <header>
        <h1>🧦 Шкарпетки & Труси</h1>
        <p>Комфортна білизна</p>
    </header>

    <div class="container">
        <h2>Популярні товари</h2>
        <div class="products">

            <div class="product">
                <img src="https://raw.githubusercontent.com/dakalgf1-arch/socks-and-underwear-store/main/trusiki1.jpg" alt="Трусики">
                <div class="info">
                    <h3>Жіночі трусики (сліпи)</h3>
                    <p><strong>449 грн</strong></p>
                    <button onclick="addToCart('Жіночі трусики (сліпи)', 449)">Купити</button>
                </div>
            </div>

            <div class="product">
                <img src="https://raw.githubusercontent.com/dakalgf1-arch/socks-and-underwear-store/main/trusiki2.jpg" alt="Трусики">
                <div class="info">
                    <h3>Жіночі трусики (висока посадка)</h3>
                    <p><strong>479 грн</strong></p>
                    <button onclick="addToCart('Жіночі трусики висока посадка', 479)">Купити</button>
                </div>
            </div>

        </div>
    </div>

    <!-- Кошик -->
    <div class="cart" id="cart">
        <h3>🛒 Кошик (<span id="count">0</span>)</h3>
        <div id="cart-items"></div>
        <p><strong>Сума: <span id="total">0</span> грн</strong></p>
        
        <button onclick="showOrderForm()" style="background:#27ae60; width:100%;">Оформити замовлення</button>
        <button onclick="clearCart()" class="clear-btn" style="width:100%;">🗑 Анулювати кошик (почати заново)</button>
    </div>

    <!-- Форма замовлення -->
    <div id="orderModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:2000;">
        <div style="background:white; margin:5% auto; padding:25px; width:90%; max-width:500px; border-radius:12px;">
            <h2>Оформлення замовлення</h2>
            <form onsubmit="sendOrder(event)">
                <div id="modal-cart-items"></div>
                <p><strong>Загальна сума: <span id="modal-total">0</span> грн</strong></p>
                
                <label>Ім'я та Прізвище:</label><br>
                <input type="text" id="customer-name" required style="width:100%; padding:10px; margin:8px 0;"><br>
                
                <label>Телефон:</label><br>
                <input type="tel" id="customer-phone" value="+380995461915" required style="width:100%; padding:10px; margin:8px 0;"><br>
                
                <label>Адреса доставки:</label><br>
                <input type="text" id="customer-address" placeholder="Місто, відділення Нової Пошти" required style="width:100%; padding:10px; margin:8px 0;"><br>
                
                <button type="submit" style="background:#27ae60; color:white; width:100%; padding:15px;">Надіслати на dakalgf1@gmail.com</button>
            </form>
            <button onclick="closeModal()" style="background:#95a5a6; color:white; width:100%; padding:12px; margin-top:10px;">Скасувати</button>
        </div>
    </div>

    <script>
        let cart = [];

        function addToCart(name, price) {
            cart.push({name, price});
            updateCart();
            alert(name + " додано в кошик ✅");
        }

        function updateCart() {
            let html = '';
            let total = 0;
            cart.forEach((item, i) => {
                total += item.price;
                html += `<p>${item.name} — ${item.price} грн</p>`;
            });
            document.getElementById('cart-items').innerHTML = html || '<p style="color:#999;">Кошик порожній</p>';
            document.getElementById('count').textContent = cart.length;
            document.getElementById('total').textContent = total;
        }

        function clearCart() {
            if (confirm("Очистити весь кошик і почати заново?")) {
                cart = [];
                updateCart();
                alert("Кошик очищено ✅");
            }
        }

        function showOrderForm() {
            if (cart.length === 0) return alert("Кошик порожній!");
            
            let itemsHtml = '<strong>Ваше замовлення:</strong><br>';
            let total = 0;
            cart.forEach(item => {
                itemsHtml += `• ${item.name} — ${item.price} грн<br>`;
                total += item.price;
            });
            
            document.getElementById('modal-cart-items').innerHTML = itemsHtml;
            document.getElementById('modal-total').textContent = total;
            document.getElementById('orderModal').style.display = 'block';
        }

        function closeModal() {
            document.getElementById('orderModal').style.display = 'none';
        }

        function sendOrder(e) {
            e.preventDefault();
            
            const name = document.getElementById('customer-name').value;
            const phone = document.getElementById('customer-phone').value;
            const address = document.getElementById('customer-address').value;
            
            let body = `Нове замовлення!\n\n`;
            body += `Покупець: ${name}\n`;
            body += `Телефон: ${phone}\n`;
            body += `Адреса: ${address}\n\n`;
            body += `Товари:\n`;
            
            let total = 0;
            cart.forEach(item => {
                body += `• ${item.name} — ${item.price} грн\n`;
                total += item.price;
            });
            
            body += `\nЗагальна сума: ${total} грн`;

            const mailto = `mailto:dakalgf1@gmail.com?subject=Нове замовлення з сайту&body=${encodeURIComponent(body)}`;
            window.location.href = mailto;

            setTimeout(() => {
                cart = [];
                updateCart();
                closeModal();
                alert("Замовлення відправлено на dakalgf1@gmail.com");
            }, 1000);
        }
    </script>
</body>
</html>
