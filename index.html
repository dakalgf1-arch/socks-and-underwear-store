<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shkarpetky & Труси</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f8f9fa; }
        header { background: linear-gradient(135deg, #ff6b6b, #4ecdc4); color: white; padding: 25px; text-align: center; }
        .tabs { display: flex; justify-content: center; background: white; padding: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .tab { padding: 12px 30px; margin: 0 10px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .tab.active { background: #ff4757; color: white; }
        
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .products { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; }
        .product { background: white; border-radius: 15px; overflow: hidden; box-shadow: 0 5px 20px rgba(0,0,0,0.1); }
        .product img { width: 100%; height: 300px; object-fit: cover; }
        .info { padding: 15px; text-align: center; }
        button { background: #ff4757; color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; margin: 5px; }
        
        .cart { 
            position: fixed; top: 20px; right: 20px; background: white; 
            padding: 15px; border-radius: 12px; box-shadow: 0 5px 25px rgba(0,0,0,0.2); 
            min-width: 300px; z-index: 1000; display: none; 
        }
    </style>
</head>
<body>
    <header>
        <h1>🧦 Шкарпетки & Труси</h1>
        <p>Комфортна білизна за доступними цінами</p>
    </header>

    <!-- Вкладки -->
    <div class="tabs">
        <div class="tab active" id="tab-socks" onclick="showCategory('socks')">🧦 Шкарпетки</div>
        <div class="tab" id="tab-underwear" onclick="showCategory('underwear')">👙 Труси</div>
    </div>

    <div class="container">
        <h2 id="category-title">Шкарпетки</h2>
        <div class="products" id="products-container">
            <!-- Товари будуть підвантажуватися через JS -->
        </div>
    </div>

    <!-- Кошик -->
    <div class="cart" id="cart">
        <h3>🛒 Кошик (<span id="count">0</span>)</h3>
        <div id="cart-items"></div>
        <p><strong>Сума: <span id="total">0</span> грн</strong></p>
        <button onclick="showOrderForm()" style="background:#27ae60; width:100%;">Оформити замовлення</button>
        <button onclick="clearCart()" style="background:#e74c3c; width:100%;">🗑 Анулювати кошик</button>
    </div>

    <!-- Форма замовлення (та сама як раніше) -->
    <div id="orderModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:2000;">
        <div style="background:white; margin:5% auto; padding:25px; width:90%; max-width:500px; border-radius:12px;">
            <h2>Оформлення замовлення</h2>
            <form onsubmit="sendOrder(event)">
                <div id="modal-cart-items"></div>
                <p><strong>Загальна сума: <span id="modal-total">0</span> грн</strong></p>
                
                <label>Ім'я та Прізвище:</label><br>
                <input type="text" id="customer-name" required style="width:100%; padding:10px; margin:8px 0;"><br>
                
                <label>Телефон:</label><br>
                <input type="tel" id="customer-phone" value="+380995461915" required style="width:100%; padding:10px; margin:8px 0;"><br>
                
                <label>Адреса доставки:</label><br>
                <input type="text" id="customer-address" placeholder="Місто, відділення Нової Пошти" required style="width:100%; padding:10px; margin:8px 0;"><br>
                
                <button type="submit" style="background:#27ae60; color:white; width:100%; padding:15px;">Надіслати на dakalgf1@gmail.com</button>
            </form>
            <button onclick="closeModal()" style="background:#95a5a6; color:white; width:100%; padding:12px; margin-top:10px;">Скасувати</button>
        </div>
    </div>

    <script>
        let cart = [];
        let currentCategory = 'socks';

        const products = {
            socks: [
                {name: "Комплект чоловічих носків (3 пари)", price: 299, img: "https://picsum.photos/300/300?random=10"},
                {name: "Жіночі теплі шкарпетки", price: 249, img: "https://picsum.photos/300/300?random=11"}
            ],
            underwear: [
                {name: "Жіночі трусики (сліпи)", price: 449, img: "https://raw.githubusercontent.com/dakalgf1-arch/socks-and-underwear-store/main/trusiki1.jpg"},
                {name: "Жіночі трусики (висока посадка)", price: 479, img: "https://raw.githubusercontent.com/dakalgf1-arch/socks-and-underwear-store/main/trusiki2.jpg"}
            ]
        };

        function showCategory(category) {
            currentCategory = category;
            document.getElementById('tab-socks').classList.toggle('active', category === 'socks');
            document.getElementById('tab-underwear').classList.toggle('active', category === 'underwear');
            document.getElementById('category-title').textContent = category === 'socks' ? '🧦 Шкарпетки' : '👙 Труси';

            const container = document.getElementById('products-container');
            container.innerHTML = '';

            products[category].forEach(product => {
                container.innerHTML += `
                    <div class="product">
                        <img src="\( {product.img}" alt=" \){product.name}">
                        <div class="info">
                            <h3>${product.name}</h3>
                            <p><strong>${product.price} грн</strong></p>
                            <button onclick="addToCart('${product.name}', ${product.price})">Купити</button>
                        </div>
                    </div>
                `;
            });
        }

        function addToCart(name, price) {
            cart.push({name, price});
            updateCart();
            alert(name + " додано в кошик ✅");
        }

        function updateCart() {
            let html = '';
            let total = 0;
            cart.forEach(item => {
                total += item.price;
                html += `<p>${item.name} — ${item.price} грн</p>`;
            });

            document.getElementById('cart-items').innerHTML = html || '<p style="color:#999;">Кошик порожній</p>';
            document.getElementById('count').textContent = cart.length;
            document.getElementById('total').textContent = total;
            document.getElementById('cart').style.display = cart.length > 0 ? 'block' : 'none';
        }

        function clearCart() {
            if (confirm("Очистити кошик і почати заново?")) {
                cart = [];
                updateCart();
            }
        }

        // Ініціалізація
        showCategory('socks');
    </script>
</body>
</html>
