                    price: 3000,
                    img: "https://phantom-drop.com.ua/wp-content/uploads/2022/10/4016954260_kofemashina-poluavtomaticheskaya-crownberg.png",
                    desc: "Crownberg CB-1566 швидко приготує кавовий напій із трьох шарів — гарячого молока, еспресо та густої молочної піни. Кількість молока та піни ви зможете самостійно встановити за допомогою бічного регулятора.\n\nДопоможе приготувати американо, каву з морозивом, лікером, корицею. Варить еспресо з кавових зерен середнього помелу. На панелі є кнопка для подвійної порції.\n\nТиск 15 барів — смак і аромат розкриваються максимально. Резервуар для води 1,6 л. Міцний сталевий корпус, майданчик для чашок, знімний піддон.",
                    specs: "<strong>Характеристики</strong>• Тип: напівавтомат<br>• Потужність: 1000 Вт<br>• Тиск: 15 бар<br>• Резервуар для води: 1,6 л<br>• Кава: мелена<br>• Капучино: ручне<br>• Корпус: нержавіюча сталь + пластик<br>• Керування: кнопкове<br>• Функції: автовимкнення, подача пари<br>• Розміри: 22×28,5×26 см<br><br><strong>Напої</strong>• Еспресо<br>• Американо<br>• Капучино"
                }
            ]
        };

        function showCategory(cat) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(t => {
                if ((cat === 'beauty' && t.textContent.includes('Краса')) ||
                    (cat === 'cosmetics' && t.textContent.includes('Косметика')) ||
                    (cat === 'tech' && t.textContent.includes('Техніка'))) {
                    t.classList.add('active');
                }
            });
            const container = document.getElementById('products');
            container.innerHTML = '';
            catalog[cat].forEach(item => {
                const div = document.createElement('div');
                div.className = 'product' + (item.desc || item.specs ? ' wide' : '');
                const descHtml = item.desc
                    ? `<div class="desc">${item.desc.replace(/\n/g, '<br>')}</div>`
                    : '';
                const specsHtml = item.specs
                    ? `<div class="specs">${item.specs}</div>`
                    : '';
                div.innerHTML = `
                    <img src="${item.img}" alt="${item.name}" onerror="this.src='https://via.placeholder.com/320x240?text=Фото'">
                    <h3>${item.name}</h3>
                    ${descHtml}
                    ${specsHtml}
                    <div class="price">${item.price} грн</div>
                    <button class="btn-buy" onclick="addToCart('${item.id}')">Купити</button>
                `;
                container.appendChild(div);
            });
        }

        function addToCart(id) {
            let product = null;
            for (const cat of Object.values(catalog)) {
                product = cat.find(p => p.id === id);
                if (product) break;
            }
            if (!product) return;
            const existing = cart.find(item => item.id === id);
            if (existing) { existing.qty += 1; }
            else { cart.push({ id: product.id, name: product.name, price: product.price, qty: 1 }); }
            updateCart();
        }

        function changeQty(id, delta) {
            const item = cart.find(i => i.id === id);
            if (!item) return;
            item.qty += delta;
            if (item.qty <= 0) cart = cart.filter(i => i.id !== id);
            updateCart();
        }

        function removeFromCart(id) {
            cart = cart.filter(i => i.id !== id);
            updateCart();
        }

        function updateCart() {
            const container = document.getElementById('cart-items');
            const orderBtn = document.getElementById('order-btn');
            let total = 0, count = 0;
            if (cart.length === 0) {
                container.innerHTML = '<p style="color:#999; text-align:center;">Кошик порожній</p>';
                orderBtn.disabled = true;
            } else {
                let html = '';
                cart.forEach(item => {
                    const sum = item.price * item.qty;
                    total += sum; count += item.qty;
                    html += `<div class="cart-item"><div class="cart-item-info"><div class="cart-item-name">${item.name}</div><div class="cart-item-price">${item.price} грн × ${item.qty} = ${sum} грн</div></div><div class="cart-item-controls"><button class="qty-btn" onclick="changeQty('${item.id}', -1)">−</button><span>${item.qty}</span><button class="qty-btn" onclick="changeQty('${item.id}', 1)">+</button><button class="remove-btn" onclick="removeFromCart('${item.id}')" title="Видалити">×</button></div></div>`;
                });
                container.innerHTML = html;
                orderBtn.disabled = false;
            }
            document.getElementById('count').textContent = count;
            document.getElementById('total').textContent = total;
        }

        function toggleCart() {
            isOpen = !isOpen;
            document.getElementById('cart-content').style.display = isOpen ? 'block' : 'none';
            document.getElementById('toggle-icon').textContent = isOpen ? '▼' : '▲';
        }

        function showOrderForm() {
            if (cart.length === 0) return;
            let summary = '<strong>Ваше замовлення:</strong><br>';
            let total = 0;
            cart.forEach(item => {
                const sum = item.price * item.qty;
                total += sum;
                summary += `• ${item.name} × ${item.qty} — ${sum} грн<br>`;
            });
            summary += `<br><strong>Разом: ${total} грн</strong>`;
            document.getElementById('order-summary').innerHTML = summary;
            document.getElementById('order-modal').classList.add('show');
        }

        function closeOrderForm() {
            document.getElementById('order-modal').classList.remove('show');
        }

        async function submitOrder(e) {
            e.preventDefault();
            const name = document.getElementById('name').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const city = document.getElementById('city').value.trim();
            const address = document.getElementById('address').value.trim();
            const comment = document.getElementById('comment').value.trim();
            const submitBtn = document.getElementById('submit-btn');
            let total = 0, itemsText = '';
            cart.forEach(item => {
                const sum = item.price * item.qty;
                total += sum;
                itemsText += `• ${item.name} × ${item.qty} = ${sum} грн\n`;
            });
            const orderText = `🛒 НОВЕ ЗАМОВЛЕННЯ з сайту\n\n👤 Ім'я: ${name}\n📞 Телефон: ${phone}\n🏙 Місто: ${city}\n📍 Адреса: ${address}${comment ? '\n💬 Коментар: ' + comment : ''}\n\n📦 Товари:\n${itemsText}\n💰 Разом: ${total} грн`;
            submitBtn.disabled = true;
            submitBtn.textContent = 'Надсилаємо...';
            try {
                const response = await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: TELEGRAM_CHAT_ID, text: orderText })
                });
                const result = await response.json();
                if (result.ok) {
                    document.getElementById('modal-content').innerHTML = `<div class="success-message"><h2>✅ Замовлення прийнято!</h2><p>Дякуємо, <strong>${name}</strong>!</p><p>Ми скоро зв'яжемося з вами за номером<br><strong>${phone}</strong></p><p style="margin-top:20px; color:#666; font-size:14px;">Сума замовлення: <strong>${total} грн</strong></p><button class="btn-submit" style="margin-top:20px; width:100%;" onclick="finishOrder()">Закрити</button></div>`;
                    cart = [];
                    updateCart();
                } else { throw new Error(result.description || 'Помилка відправки'); }
            } catch (err) {
                alert('Не вдалося надіслати замовлення. Спробуйте ще раз.\n\nПомилка: ' + err.message);
                submitBtn.disabled = false;
                submitBtn.textContent = 'Підтвердити замовлення';
            }
        }

        function finishOrder() { closeOrderForm(); location.reload(); }
        document.getElementById('order-modal').addEventListener('click', function(e) { if (e.target === this) closeOrderForm(); });
        showCategory('tech');
    </script>
</body>
</html>
