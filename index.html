<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shkarpetky & Труси</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f8f9fa; }
        header { background: linear-gradient(135deg, #ff6b6b, #4ecdc4); color: white; padding: 25px; text-align: center; }
        .tabs { display: flex; justify-content: center; background: white; padding: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .tab { padding: 12px 35px; margin: 0 8px; border-radius: 50px; cursor: pointer; font-weight: bold; }
        .tab.active { background: #ff4757; color: white; }

        .product { background: white; border-radius: 15px; padding: 20px; margin: 15px auto; box-shadow: 0 5px 20px rgba(0,0,0,0.1); text-align: center; max-width: 350px; }
        button { border: none; padding: 12px 25px; border-radius: 8px; cursor: pointer; font-size: 16px; }

        .cart { 
            position: fixed; bottom: 20px; right: 20px; background: white; 
            border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.25); 
            width: 340px; z-index: 1000; overflow: hidden;
        }
        .cart-header { background: #ff4757; color: white; padding: 15px; cursor: pointer; display: flex; justify-content: space-between; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 2000; }
        .modal-content { background: white; margin: 5% auto; padding: 25px; width: 90%; max-width: 500px; border-radius: 15px; }
    </style>
</head>
<body>
    <header>
        <h1>🧦 Шкарпетки & Труси</h1>
    </header>

    <div class="tabs">
        <div class="tab active" onclick="showCategory('socks')">🧦 Шкарпетки</div>
        <div class="tab" onclick="showCategory('underwear')">👙 Труси</div>
    </div>

    <div style="text-align:center; padding:20px;" id="products"></div>

    <!-- Кошик -->
    <div class="cart" id="cart">
        <div class="cart-header" onclick="toggleCart()">
            <h3>🛒 Кошик (<span id="count">0</span>)</h3>
            <span id="toggle-icon">▼</span>
        </div>
        <div id="cart-content" style="padding:15px; display:block;">
            <div id="cart-items"></div>
            <p><strong>Разом: <span id="total">0</span> грн</strong></p>
            <button onclick="showOrderForm()" style="background:#27ae60; color:white; width:100%; padding:15px;">Оформити замовлення</button>
        </div>
    </div>

    <!-- Форма замовлення -->
    <div class="modal" id="orderModal">
        <div class="modal-content">
            <h2>Оформлення замовлення</h2>
            <form onsubmit="sendOrder(event)">
                <div id="modal-items"></div>
                <p><strong>Загальна сума: <span id="modal-total">0</span> грн</strong></p>
                
                <label>Ім'я та Прізвище:</label><br>
                <input type="text" id="name" required style="width:100%; padding:10px; margin:8px 0;"><br>
                
                <label>Телефон:</label><br>
                <input type="tel" id="phone" value="+380995461915" required style="width:100%; padding:10px; margin:8px 0;"><br>
                
                <label>Адреса доставки:</label><br>
                <input type="text" id="address" placeholder="Місто, відділення Нової Пошти" required style="width:100%; padding:10px; margin:8px 0;"><br>
                
                <button type="submit" style="background:#27ae60; color:white; width:100%; padding:15px; margin-top:10px;">Надіслати замовлення на пошту</button>
            </form>
            <button onclick="closeModal()" style="background:#95a5a6; color:white; width:100%; padding:12px; margin-top:8px;">Скасувати</button>
        </div>
    </div>

    <script>
        let cart = [];
        let isOpen = true;

        function showCategory(cat) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.currentTarget.classList.add('active');

            const container = document.getElementById('products');
            container.innerHTML = cat === 'socks' ? `
                <div class="product">
                    <h3>Шкарпетки чоловічі спортивні</h3>
                    <p>Туреччина • 41-44 • Чорний</p>
                    <p><strong>55 грн</strong></p>
                    <button onclick="addToCart('Шкарпетки чоловічі спортивні', 55)">Купити</button>
                </div>` : `
                <div class="product">
                    <h3>Жіночі трусики</h3>
                    <p><strong>449 грн</strong></p>
                    <button onclick="addToCart('Жіночі трусики', 449)">Купити</button>
                </div>`;
        }

        function addToCart(name, price) {
            cart.push({name, price});
            updateCart();
            alert(name + " додано в кошик ✅");
        }

        function updateCart() {
            let html = '';
            let total = 0;
            cart.forEach(item => {
                total += item.price;
                html += `<p>${item.name} — ${item.price} грн</p>`;
            });
            document.getElementById('cart-items').innerHTML = html || '<p>Кошик порожній</p>';
            document.getElementById('count').textContent = cart.length;
            document.getElementById('total').textContent = total;
        }

        function toggleCart() {
            isOpen = !isOpen;
            document.getElementById('cart-content').style.display = isOpen ? 'block' : 'none';
            document.getElementById('toggle-icon').textContent = isOpen ? '▼' : '▲';
        }

        function showOrderForm() {
            if (cart.length === 0) return alert("Кошик порожній!");
            
            let itemsHtml = '';
            let total = 0;
            cart.forEach(item => {
                itemsHtml += `• ${item.name} — ${item.price} грн<br>`;
                total += item.price;
            });
            
            document.getElementById('modal-items').innerHTML = `<strong>Замовлення:</strong><br>${itemsHtml}`;
            document.getElementById('modal-total').textContent = total;
            document.getElementById('orderModal').style.display = 'block';
        }

        function closeModal() {
            document.getElementById('orderModal').style.display = 'none';
        }

        function sendOrder(e) {
            e.preventDefault();
            
            const name = document.getElementById('name').value;
            const phone = document.getElementById('phone').value;
            const address = document.getElementById('address').value;
            
            let body = `Нове замовлення!\n\n`;
            body += `Покупець: ${name}\n`;
            body += `Телефон: ${phone}\n`;
            body += `Адреса: ${address}\n\n`;
            body += `Товари:\n`;
            
            let total = 0;
            cart.forEach(item => {
                body += `• ${item.name} — ${item.price} грн\n`;
                total += item.price;
            });
            body += `\nЗагальна сума: ${total} грн`;

            window.location.href = `mailto:dakalgf1@gmail.com?subject=Нове замовлення Shkarpetky & Труси&body=${encodeURIComponent(body)}`;
            
            alert("Замовлення відправлено на dakalgf1@gmail.com");
            cart = [];
            updateCart();
            closeModal();
        }

        showCategory('socks');
    </script>
</body>
</html>
