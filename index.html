<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shkarpetky & Труси</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f8f9fa; }
        header { background: linear-gradient(135deg, #ff6b6b, #4ecdc4); color: white; padding: 2rem; text-align: center; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .products { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; }
        .product { background: white; border-radius: 15px; overflow: hidden; box-shadow: 0 5px 20px rgba(0,0,0,0.1); }
        .product img { width: 100%; height: 320px; object-fit: cover; }
        .info { padding: 15px; text-align: center; }
        button { background: #ff4757; color: white; border: none; padding: 12px; margin: 8px 5px; border-radius: 8px; cursor: pointer; font-size: 16px; }
        button:hover { background: #ff3838; }
        .cart { position: fixed; top: 20px; right: 20px; background: white; padding: 15px; border-radius: 12px; box-shadow: 0 5px 20px rgba(0,0,0,0.2); max-width: 320px; z-index: 100; }
    </style>
</head>
<body>
    <header>
        <h1>🧦 Шкарпетки & Труси</h1>
        <p>Комфортна білизна для кожного дня</p>
    </header>

    <div class="container">
        <h2>Наші товари</h2>
        <div class="products">

            <div class="product">
                <img src="https://raw.githubusercontent.com/dakalgf1-arch/socks-and-underwear-store/main/trusiki1.jpg" alt="Жіночі трусики">
                <div class="info">
                    <h3>Жіночі трусики (сліпи)</h3>
                    <p><strong>449 грн</strong></p>
                    <button onclick="addToCart('Жіночі трусики (сліпи)', 449)">Купити</button>
                </div>
            </div>

            <div class="product">
                <img src="https://raw.githubusercontent.com/dakalgf1-arch/socks-and-underwear-store/main/trusiki2.jpg" alt="Жіночі трусики">
                <div class="info">
                    <h3>Жіночі трусики (висока посадка)</h3>
                    <p><strong>479 грн</strong></p>
                    <button onclick="addToCart('Жіночі трусики висока посадка', 479)">Купити</button>
                </div>
            </div>

            <div class="product">
                <img src="https://raw.githubusercontent.com/dakalgf1-arch/socks-and-underwear-store/main/trusiki3.jpg" alt="Жіночі трусики">
                <div class="info">
                    <h3>Жіночі трусики (набір 3 шт)</h3>
                    <p><strong>1190 грн</strong></p>
                    <button onclick="addToCart('Набір жіночих трусиків 3 шт', 1190)">Купити</button>
                </div>
            </div>

        </div>
    </div>

    <!-- Кошик (скорочено) -->
    <div class="cart" id="cart">
        <h3>🛒 Кошик (<span id="count">0</span>)</h3>
        <p><strong>Разом: <span id="total">0</span> грн</strong></p>
        <button onclick="alert('Кошик працює! Додай товари і натисни ще раз')">Оформити замовлення</button>
    </div>

    <script>
        let cart = [];
        function addToCart(name, price) {
            cart.push({name, price});
            document.getElementById('count').textContent = cart.length;
            let total = cart.reduce((sum, item) => sum + item.price, 0);
            document.getElementById('total').textContent = total;
            alert(name + " додано в кошик ✅");
        }
    </script>
</body>
</html>
