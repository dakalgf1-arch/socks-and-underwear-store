<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shkarpetky & Труси</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f8f9fa; }
        h1 { color: #ff4757; text-align: center; }
        .product { background: white; padding: 15px; margin: 15px auto; max-width: 400px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; }
        button { background: #ff4757; color: white; border: none; padding: 12px 25px; border-radius: 8px; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>🧦 Шкарпетки & Труси</h1>
    <p style="text-align:center;">Комфортна білизна</p>

    <div class="product">
        <h3>Жіночі трусики (сліпи)</h3>
        <p><strong>449 грн</strong></p>
        <button onclick="alert('✅ Додано в кошик! (тест)')">Купити</button>
    </div>

    <div class="product">
        <h3>Жіночі трусики (висока посадка)</h3>
        <p><strong>479 грн</strong></p>
        <button onclick="alert('✅ Додано в кошик! (тест)')">Купити</button>
    </div>

    <p style="text-align:center; margin-top:30px; color:#666;">
        Кошик поки що в тестовому режимі. Натисни кнопку — має з'явитись повідомлення.
    </p>
</body>
</html>
