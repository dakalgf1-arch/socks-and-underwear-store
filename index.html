<p id="ld" style="font-family:Arial;text-align:center;margin-top:40px">Завантаження магазину…</p>
<script>
(function(){
  var urls=[
    'https://cdn.jsdelivr.net/gh/dakalgf1-arch/socks-and-underwear-store@4fd2da1e98b661bfe131576085a01646650bb7a7/index.html',

  ];
  function tryLoad(i){
    if(i>=urls.length){document.getElementById('ld').innerHTML='Не вдалося завантажити. <a href="https://cdn.jsdelivr.net/gh/dakalgf1-arch/socks-and-underwear-store@4fd2da1e98b661bfe131576085a01646650bb7a7/index.html">Відкрити магазин</a>';return;}
    fetch(urls[i]).then(function(r){if(!r.ok)throw new Error('fail');return r.text()}).then(function(html){
      document.open();document.write(html);document.close();
    }).catch(function(){tryLoad(i+1)});
  }
  tryLoad(0);
})();
</script>
