function showCategory(cat){document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));document.querySelectorAll('.tab').forEach(t=>{if((cat==='beauty'&&t.textContent.includes('Краса'))||(cat==='cosmetics'&&t.textContent.includes('Косметика'))||(cat==='tech'&&t.textContent.includes('Техніка'))||(cat==='tools'&&t.textContent.includes('інструмент'))||(cat==='kitchen'&&t.textContent.includes('кухні')))t.classList.add('active')});const c=document.getElementById('products');c.innerHTML='';(catalog[cat]||[]).forEach(item=>{const d=document.createElement('div');d.className='product'+(item.desc?' wide':'');const desc=item.desc?`<div class="desc">${item.desc}</div>`:'';d.innerHTML=`<img src="${item.img}" alt="${item.name}" onerror="this.src='https://via.placeholder.com/320x240?text=Фото'"><h3>${item.name}</h3>${desc}<div class="price">${item.price} грн</div><button class="btn-buy" onclick="addToCart('${item.id}')">Купити</button>`;c.appendChild(d)})}
function addToCart(id){let p=null;for(const cat of Object.values(catalog)){p=cat.find(x=>x.id===id);if(p)break}if(!p)return;const e=cart.find(i=>i.id===id);if(e){e.qty+=1;if(!e.link&&p.link)e.link=p.link}else cart.push({id:p.id,name:p.name,price:p.price,qty:1,link:p.link||''});updateCart()}
function changeQty(id,d){const i=cart.find(x=>x.id===id);if(!i)return;i.qty+=d;if(i.qty<=0)cart=cart.filter(x=>x.id!==id);updateCart()}
function removeFromCart(id){cart=cart.filter(i=>i.id!==id);updateCart()}
function updateCart(){const c=document.getElementById('cart-items'),b=document.getElementById('order-btn');let t=0,n=0;if(!cart.length){c.innerHTML='<p style="color:#999;text-align:center">Кошик порожній</p>';b.disabled=true}else{let h='';cart.forEach(i=>{const s=i.price*i.qty;t+=s;n+=i.qty;h+=`<div class="cart-item"><div class="cart-item-info"><div class="cart-item-name">${i.name}</div><div class="cart-item-price">${i.price} грн × ${i.qty} = ${s} грн</div></div><div class="cart-item-controls"><button class="qty-btn" onclick="changeQty('${i.id}',-1)">−</button><span>${i.qty}</span><button class="qty-btn" onclick="changeQty('${i.id}',1)">+</button><button class="remove-btn" onclick="removeFromCart('${i.id}')">×</button></div></div>`});c.innerHTML=h;b.disabled=false}document.getElementById('count').textContent=n;document.getElementById('total').textContent=t}
function toggleCart(){isOpen=!isOpen;document.getElementById('cart-content').style.display=isOpen?'block':'none';document.getElementById('toggle-icon').textContent=isOpen?'▼':'▲'}
function showOrderForm(){if(!cart.length)return;let s='<strong>Замовлення:</strong><br>',t=0;cart.forEach(i=>{const x=i.price*i.qty;t+=x;s+=`• ${i.name} × ${i.qty} — ${x} грн<br>`});s+=`<br><strong>Разом: ${t} грн</strong>`;document.getElementById('order-summary').innerHTML=s;document.getElementById('order-modal').classList.add('show')}
function closeOrderForm(){document.getElementById('order-modal').classList.remove('show')}
async function submitOrder(e){e.preventDefault();const name=document.getElementById('name').value.trim(),phone=document.getElementById('phone').value.trim(),city=document.getElementById('city').value.trim(),address=document.getElementById('address').value.trim(),comment=document.getElementById('comment').value.trim(),btn=document.getElementById('submit-btn');let total=0,items='';cart.forEach(i=>{const s=i.price*i.qty;total+=s;items+=`• ${i.name} × ${i.qty} = ${s} грн`+(i.link?`\n  🔗 ${i.link}`:'')+`\n`});const text=`🛒 НОВЕ ЗАМОВЛЕННЯ\n\n👤 ${name}\n📞 ${phone}\n🏙 ${city}\n📍 ${address}${comment?'\n💬 '+comment:''}\n\n📦 Товари:\n${items}\n💰 Разом: ${total} грн`;btn.disabled=true;btn.textContent='Надсилаємо...';try{const r=await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({chat_id:TELEGRAM_CHAT_ID,text})});const j=await r.json();if(j.ok){document.getElementById('modal-content').innerHTML=`<div class="success-message"><h2>✅ Замовлення прийнято!</h2><p>Дякуємо, <strong>${name}</strong>!</p><p>${phone}</p><p>Сума: <strong>${total} грн</strong></p><button class="btn-submit" style="margin-top:20px;width:100%" onclick="finishOrder()">Закрити</button></div>`;cart=[];updateCart()}else throw new Error(j.description||'Помилка')}catch(err){alert('Помилка: '+err.message);btn.disabled=false;btn.textContent='Підтвердити'}}
function finishOrder(){closeOrderForm();location.reload()}
document.getElementById('order-modal').addEventListener('click',function(e){if(e.target===this)closeOrderForm()});
showCategory('tech');
</script>
