<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shkarpetky & Труси</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f8f9fa; }
        header { background: linear-gradient(135deg, #ff6b6b, #4ecdc4); color: white; padding: 25px; text-align: center; }
        .tabs { display: flex; justify-content: center; background: white; padding: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .tab { padding: 12px 30px; margin: 0 10px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .tab.active { background: #ff4757; color: white; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .products { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; }
        .product { background: white; border-radius: 15px; overflow: hidden; box-shadow: 0 5px 20px rgba(0,0,0,0.1); }
        .product img { width: 100%; height: 300px; object-fit: cover; }
        .info { padding: 15px; text-align: center; }
        button { background: #ff4757; color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>
    <header>
        <h1>🧦 Шкарпетки & Труси</h1>
        <p>Комфортна білизна</p>
    </header>

    <div class="tabs">
        <div class="tab active" onclick="showCategory('socks')">🧦 Шкарпетки</div>
        <div class="tab" onclick="showCategory('underwear')">👙 Труси</div>
    </div>

    <div class="container">
        <h2 id="category-title">Шкарпетки</h2>
        <div class="products" id="products"></div>
    </div>

    <script>
        function showCategory(cat) {
            const products = document.getElementById('products');
            const title = document.getElementById('category-title');
            if (cat === 'socks') {
                title.textContent = '🧦 Шкарпетки';
                products.innerHTML = `
                    <div class="product">
                        <img src="socks1.jpg" alt="Носки">
                        <div class="info">
                            <h3>Комплект носків (3 пари)</h3>
                            <p><strong>299 грн</strong></p>
                            <button onclick="alert('Додано в кошик!')">Купити</button>
                        </div>
                    </div>`;
            } else {
                title.textContent = '👙 Труси';
                products.innerHTML = `
                    <div class="product">
                        <img src="trusiki1.jpg" alt="Трусики">
                        <div class="info">
                            <h3>Жіночі трусики</h3>
                            <p><strong>449 грн</strong></p>
                            <button onclick="alert('Додано в кошик!')">Купити</button>
                        </div>
                    </div>`;
            }
        }
        showCategory('socks');
    </script>
</body>
</html>
