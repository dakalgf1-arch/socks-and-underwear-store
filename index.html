<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shkarpetky & Труси</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f8f9fa; }
        header { background: linear-gradient(135deg, #ff6b6b, #4ecdc4); color: white; padding: 30px; text-align: center; }
        .tabs { display: flex; justify-content: center; background: white; padding: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .tab { padding: 15px 40px; margin: 0 10px; border-radius: 10px; cursor: pointer; font-size: 18px; font-weight: bold; }
        .tab.active { background: #ff4757; color: white; }
        .product { background: white; border-radius: 15px; padding: 20px; margin: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); text-align: center; max-width: 350px; }
        button { background: #ff4757; color: white; border: none; padding: 12px 25px; border-radius: 8px; cursor: pointer; font-size: 16px; }
    </style>
</head>
<body>
    <header>
        <h1>🧦 Шкарпетки & Труси</h1>
        <p>Комфортна білизна</p>
    </header>

    <div class="tabs">
        <div class="tab active" onclick="showCategory('socks')">🧦 Шкарпетки</div>
        <div class="tab" onclick="showCategory('underwear')">👙 Труси</div>
    </div>

    <div style="text-align:center; padding:20px;">
        <h2 id="category-title">Шкарпетки</h2>
        <div id="products"></div>
    </div>

    <script>
        function showCategory(cat) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.currentTarget.classList.add('active');
            document.getElementById('category-title').textContent = cat === 'socks' ? '🧦 Шкарпетки' : '👙 Труси';

            const container = document.getElementById('products');
            container.innerHTML = cat === 'socks' ? `
                <div class="product">
                    <img src="socks1.jpg" style="width:100%; max-height:280px; object-fit:contain;" alt="Носки">
                    <h3>Шкарпетки чоловічі спортивні</h3>
                    <p>Туреччина • Без шва • 41-44 • Чорний</p>
                    <p><strong>55 грн</strong></p>
                    <button onclick="alert('✅ Додано в кошик!')">Купити</button>
                </div>` : `
                <div class="product">
                    <img src="trusiki1.jpg" style="width:100%; max-height:280px; object-fit:contain;" alt="Трусики">
                    <h3>Жіночі трусики</h3>
                    <p><strong>449 грн</strong></p>
                    <button onclick="alert('✅ Додано в кошик!')">Купити</button>
                </div>`;
        }

        showCategory('socks');
    </script>
</body>
</html>
