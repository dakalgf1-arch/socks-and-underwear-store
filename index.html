<style>
*{box-sizing:border-box}body{font-family:Arial,sans-serif;margin:0;background:#f8f9fa;padding-bottom:120px}header{background:linear-gradient(135deg,#ff6b6b,#4ecdc4);color:#fff;padding:25px;text-align:center}.tabs{display:flex;justify-content:center;flex-wrap:wrap;background:#fff;padding:12px;box-shadow:0 2px 5px rgba(0,0,0,.1);gap:6px}.tab{padding:12px 22px;border-radius:50px;cursor:pointer;font-weight:700;font-size:14px}.tab:hover{background:#ffe0e3}.tab.active{background:#ff4757;color:#fff}.products{display:flex;flex-wrap:wrap;justify-content:center;gap:20px;padding:20px}.product{background:#fff;border-radius:16px;padding:15px;width:320px;box-shadow:0 5px 20px rgba(0,0,0,.1);text-align:center}.product.wide{width:560px;max-width:95vw}.product img{width:100%;height:220px;object-fit:contain;border-radius:12px;background:#f0f0f0;cursor:pointer;transition:transform .2s}.product img:hover{transform:scale(1.03)}.product h3{margin:12px 0 6px;font-size:17px;line-height:1.3;cursor:pointer}.product .desc{font-size:13px;color:#444;text-align:left;line-height:1.5;margin:10px 0 8px;max-height:160px;overflow-y:auto;padding:8px 6px;background:#fafafa;border-radius:8px}.product .price{font-size:20px;font-weight:700;color:#ff4757;margin-bottom:12px}button{border:none;padding:12px 25px;border-radius:8px;cursor:pointer;font-size:16px}.btn-buy{background:#ff4757;color:#fff;width:100%}.cart{position:fixed;bottom:20px;right:20px;background:#fff;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.25);width:360px;max-width:calc(100vw - 40px);z-index:1000;overflow:hidden}.cart-header{background:#ff4757;color:#fff;padding:15px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}.cart-header h3{margin:0;font-size:18px}#cart-content{padding:15px;max-height:400px;overflow-y:auto}.cart-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #eee}.cart-item-info{flex:1}.cart-item-name{font-weight:500;font-size:14px}.cart-item-price{color:#666;font-size:13px}.cart-item-controls{display:flex;align-items:center;gap:8px}.qty-btn{width:28px;height:28px;border-radius:50%;background:#f0f0f0;font-weight:700;padding:0;font-size:16px}.remove-btn{background:none;color:#e74c3c;font-size:18px;padding:0 6px}.cart-total{font-size:18px;margin:15px 0}.btn-order{background:#27ae60;color:#fff;width:100%;padding:15px;font-size:16px;font-weight:700}.btn-order:disabled{background:#95a5a6;cursor:not-allowed}.modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:2000;justify-content:center;align-items:center}.modal-overlay.show{display:flex}.modal{background:#fff;border-radius:16px;padding:25px;width:90%;max-width:420px;max-height:90vh;overflow-y:auto}.modal h2{margin-top:0;color:#ff4757}.form-group{margin-bottom:15px}.form-group label{display:block;margin-bottom:5px;font-weight:500}.form-group input,.form-group textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;font-size:16px}.order-summary{background:#f8f9fa;padding:12px;border-radius:8px;margin-bottom:15px;font-size:14px}.modal-buttons{display:flex;gap:10px;margin-top:20px}.btn-cancel{background:#95a5a6;color:#fff;flex:1}.btn-submit{background:#27ae60;color:#fff;flex:2}.success-message{text-align:center;padding:20px}.success-message h2{color:#27ae60}
.product-modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.75);z-index:3000;justify-content:center;align-items:center;padding:16px;overflow-y:auto}
.product-modal.show{display:flex}
.product-modal-box{background:#fff;border-radius:16px;max-width:520px;width:100%;max-height:92vh;overflow-y:auto;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.product-modal-box img{width:100%;max-height:360px;object-fit:contain;background:#f5f5f5;border-radius:16px 16px 0 0}
.product-modal-body{padding:20px}
.product-modal-body h2{margin:0 0 10px;font-size:20px;line-height:1.3}
.product-modal-body .pm-price{font-size:24px;font-weight:700;color:#ff4757;margin:12px 0}
.product-modal-body .pm-desc{font-size:14px;color:#444;line-height:1.6;margin:12px 0;text-align:left;cursor:pointer}
.pm-details{display:none;font-size:14px;color:#333;line-height:1.65;text-align:left;margin:8px 0;padding:12px;background:#fafafa;border-radius:8px;border:1px solid #eee}
.pm-details.show{display:block}
.pm-toggle{background:none;border:none;color:#ff4757;font-weight:700;font-size:14px;cursor:pointer;padding:8px 0;display:block;text-align:left}
.pm-actions{display:flex;gap:10px;margin-top:16px}
.pm-actions .btn-back{background:#95a5a6;color:#fff;flex:1;padding:14px}
.pm-actions .btn-buy{flex:2;padding:14px}
.pm-close{position:absolute;top:10px;right:12px;background:rgba(0,0,0,.5);color:#fff;border:none;width:36px;height:36px;border-radius:50%;font-size:20px;cursor:pointer;z-index:1}
</style>
</head>
<body>
<header><h1>Комфорт Маркет</h1><p>Техніка · Краса · Кухня · Одяг · Інструмент</p></header>
<div class="tabs">
<div class="tab active" onclick="showCategory('tech')">🔌 Техніка</div>
<div class="tab" onclick="showCategory('beauty')">✨ Краса і здоров'я</div>
<div class="tab" onclick="showCategory('cosmetics')">💄 Косметика</div>
<div class="tab" onclick="showCategory('tools')">🔧 Авто і інструмент</div>
<div class="tab" onclick="showCategory('kitchen')">🍳 Все для кухні</div>
<div class="tab" onclick="showCategory('clothes')">👗 Одяг і взуття, сумки</div>
</div>
<div class="products" id="products"></div>
<div class="cart" id="cart">
<div class="cart-header" onclick="toggleCart()"><h3>🛒 Кошик (<span id="count">0</span>)</h3><span id="toggle-icon">▼</span></div>
<div id="cart-content">
<div id="cart-items"><p style="color:#999;text-align:center">Кошик порожній</p></div>
<p class="cart-total"><strong>Разом: <span id="total">0</span> грн</strong></p>
<button class="btn-order" id="order-btn" onclick="showOrderForm()" disabled>Оформити замовлення</button>
</div></div>
<div class="product-modal" id="product-modal" onclick="if(event.target===this)closeProductDetail()">
<div class="product-modal-box">
<button class="pm-close" onclick="closeProductDetail()">×</button>
<img id="pm-img" src="" alt="">
<div class="product-modal-body">
<h2 id="pm-name"></h2>
<div class="pm-desc" id="pm-desc"></div>
<button type="button" class="pm-toggle" id="pm-toggle" style="display:none">▼ Показати повний опис</button>
<div class="pm-details" id="pm-details"></div>
<div class="pm-price" id="pm-price"></div>
<div class="pm-actions">
<button class="btn-back" onclick="closeProductDetail()">← Назад</button>
<button class="btn-buy" id="pm-buy">Купити</button>
</div>
</div>
</div>
</div>
<div class="modal-overlay" id="order-modal">
<div class="modal" id="modal-content">
<h2>📦 Оформлення замовлення</h2>
<div class="order-summary" id="order-summary"></div>
<form id="order-form" onsubmit="submitOrder(event)">
<div class="form-group"><label>Ваше ім'я *</label><input type="text" id="name" required></div>
<div class="form-group"><label>Телефон *</label><input type="tel" id="phone" required></div>
<div class="form-group"><label>Місто *</label><input type="text" id="city" required></div>
<div class="form-group"><label>Адреса / Нова Пошта *</label><textarea id="address" required></textarea></div>
<div class="form-group"><label>Коментар</label><textarea id="comment"></textarea></div>
<div class="modal-buttons"><button type="button" class="btn-cancel" onclick="closeOrderForm()">Скасувати</button><button type="submit" class="btn-submit" id="submit-btn">Підтвердити</button></div>
</form></div></div>
<script src="clothes.js"></script>
<script src="tools.js"></script>
<script src="catalog.js"></script>
<script>
let cart=[],isOpen=true;
const TELEGRAM_BOT_TOKEN='8791143315:AAHIkx6LMQKn5E9ZIiXzUhms998M7WDXkiI';
const TELEGRAM_CHAT_ID='5393712604';
const catalog=window.catalog||{};
function showCategory(cat){document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));document.querySelectorAll('.tab').forEach(t=>{if((cat==='beauty'&&t.textContent.includes('Краса'))||(cat==='cosmetics'&&t.textContent.includes('Косметика'))||(cat==='tech'&&t.textContent.includes('Техніка'))||(cat==='tools'&&t.textContent.includes('інструмент'))||(cat==='kitchen'&&t.textContent.includes('кухні'))||(cat==='clothes'&&t.textContent.includes('Одяг')))t.classList.add('active')});const c=document.getElementById('products');c.innerHTML='';(catalog[cat]||[]).forEach(item=>{const d=document.createElement('div');d.className='product'+(item.desc?' wide':'');const desc=item.desc?`<div class="desc">${item.desc}</div>`:'';d.innerHTML=`<img src="${item.img}" alt="${item.name}" onclick="showProductDetail('${item.id}')" onerror="this.src='https://via.placeholder.com/320x240?text=Фото'"><h3 onclick="showProductDetail('${item.id}')">${item.name}</h3>${desc}<div class="price">${item.price} грн</div><button class="btn-buy" onclick="addToCart('${item.id}')">Купити</button>`;c.appendChild(d)})}
function findProduct(id){for(const[cat,items]of Object.entries(catalog)){const p=(items||[]).find(x=>x.id===id);if(p)return{product:p,category:cat}}return null}
function showProductDetail(id,updateUrl){const found=findProduct(id);if(!found)return;const p=found.product;if(found.category)showCategory(found.category);document.getElementById('pm-img').src=p.img;document.getElementById('pm-img').alt=p.name;document.getElementById('pm-name').textContent=p.name;const descEl=document.getElementById('pm-desc');const detEl=document.getElementById('pm-details');const tog=document.getElementById('pm-toggle');const short=p.desc||'';const full=p.details||p.desc||'Опис відсутній';descEl.textContent=short||full;descEl.style.display='block';detEl.textContent=full;detEl.classList.remove('show');if(p.details&&p.details.length>(p.desc||'').length+20){tog.style.display='block';tog.textContent='▼ Показати повний опис';const doToggle=function(){const open=detEl.classList.toggle('show');tog.textContent=open?'▲ Згорнути опис':'▼ Показати повний опис'};tog.onclick=doToggle;descEl.onclick=doToggle}else{tog.style.display='none';descEl.onclick=null}document.getElementById('pm-price').textContent=p.price+' грн';document.getElementById('pm-buy').onclick=function(){addToCart(p.id);closeProductDetail()};document.getElementById('product-modal').classList.add('show');document.body.style.overflow='hidden';if(updateUrl!==false){const u=new URL(location.href);u.searchParams.set('product',id);history.replaceState(null,'',u)}}
function closeProductDetail(){document.getElementById('product-modal').classList.remove('show');document.body.style.overflow='';const u=new URL(location.href);if(u.searchParams.has('product')){u.searchParams.delete('product');history.replaceState(null,'',u)}}
function addToCart(id){let p=null;for(const cat of Object.values(catalog)){p=cat.find(x=>x.id===id);if(p)break}if(!p)return;const e=cart.find(i=>i.id===id);if(e){e.qty+=1;if(!e.link&&p.link)e.link=p.link}else cart.push({id:p.id,name:p.name,price:p.price,qty:1,link:p.link||''});updateCart()}
function changeQty(id,d){const i=cart.find(x=>x.id===id);if(!i)return;i.qty+=d;if(i.qty<=0)cart=cart.filter(x=>x.id!==id);updateCart()}
function removeFromCart(id){cart=cart.filter(i=>i.id!==id);updateCart()}
function updateCart(){const c=document.getElementById('cart-items'),b=document.getElementById('order-btn');let t=0,n=0;if(!cart.length){c.innerHTML='<p style="color:#999;text-align:center">Кошик порожній</p>';b.disabled=true}else{let h='';cart.forEach(i=>{const s=i.price*i.qty;t+=s;n+=i.qty;h+=`<div class="cart-item"><div class="cart-item-info"><div class="cart-item-name">${i.name}</div><div class="cart-item-price">${i.price} грн × ${i.qty} = ${s} грн</div></div><div class="cart-item-controls"><button class="qty-btn" onclick="changeQty('${i.id}',-1)">−</button><span>${i.qty}</span><button class="qty-btn" onclick="changeQty('${i.id}',1)">+</button><button class="remove-btn" onclick="removeFromCart('${i.id}')">×</button></div></div>`});c.innerHTML=h;b.disabled=false}document.getElementById('count').textContent=n;document.getElementById('total').textContent=t}
function toggleCart(){isOpen=!isOpen;document.getElementById('cart-content').style.display=isOpen?'block':'none';document.getElementById('toggle-icon').textContent=isOpen?'▼':'▲'}
function showOrderForm(){if(!cart.length)return;let s='<strong>Замовлення:</strong><br>',t=0;cart.forEach(i=>{const x=i.price*i.qty;t+=x;s+=`• ${i.name} × ${i.qty} — ${x} грн<br>`});s+=`<br><strong>Разом: ${t} грн</strong>`;document.getElementById('order-summary').innerHTML=s;document.getElementById('order-modal').classList.add('show')}
function closeOrderForm(){document.getElementById('order-modal').classList.remove('show')}
async function submitOrder(e){e.preventDefault();const name=document.getElementById('name').value.trim(),phone=document.getElementById('phone').value.trim(),city=document.getElementById('city').value.trim(),address=document.getElementById('address').value.trim(),comment=document.getElementById('comment').value.trim(),btn=document.getElementById('submit-btn');let total=0,items='';cart.forEach(i=>{const s=i.price*i.qty;total+=s;items+=`• ${i.name} × ${i.qty} = ${s} грн`+(i.link?`\n  🔗 ${i.link}`:'')+`\n`});const text=`🛒 НОВЕ ЗАМОВЛЕННЯ\n\n👤 ${name}\n📞 ${phone}\n🏙 ${city}\n📍 ${address}${comment?'\n💬 '+comment:''}\n\n📦 Товари:\n${items}\n💰 Разом: ${total} грн`;btn.disabled=true;btn.textContent='Надсилаємо...';try{const r=await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({chat_id:TELEGRAM_CHAT_ID,text})});const j=await r.json();if(j.ok){document.getElementById('modal-content').innerHTML=`<div class="success-message"><h2>✅ Замовлення прийнято!</h2><p>Дякуємо, <strong>${name}</strong>!</p><p>${phone}</p><p>Сума: <strong>${total} грн</strong></p><button class="btn-submit" style="margin-top:20px;width:100%" onclick="finishOrder()">Закрити</button></div>`;cart=[];updateCart()}else throw new Error(j.description||'Помилка')}catch(err){alert('Помилка: '+err.message);btn.disabled=false;btn.textContent='Підтвердити'}}
function finishOrder(){closeOrderForm();location.reload()}
document.getElementById('order-modal').addEventListener('click',function(e){if(e.target===this)closeOrderForm()});
(function initFromUrl(){const id=new URLSearchParams(location.search).get('product');if(id&&findProduct(id)){showProductDetail(id,false)}else{showCategory('tech')}})();
</script>
</body>
</html>
