<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shkarpetky & Труси</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f8f9fa; }
        header { background: linear-gradient(135deg, #ff6b6b, #4ecdc4); color: white; padding: 30px; text-align: center; }
        .tabs { display: flex; justify-content: center; background: white; padding: 15px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .tab { padding: 15px 40px; margin: 0 10px; border-radius: 10px; cursor: pointer; font-size: 18px; font-weight: bold; }
        .tab.active { background: #ff4757; color: white; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .product { background: white; border-radius: 15px; padding: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); text-align: center; margin: 15px; }
        .product img { width: 100%; max-height: 300px; object-fit: contain; border-radius: 10px; }
    </style>
</head>
<body>
    <header>
        <h1>🧦 Шкарпетки & Труси</h1>
        <p>Якісний товар оптом та в роздріб</p>
    </header>

    <div class="tabs">
        <div class="tab active" onclick="showCategory('socks')">🧦 Шкарпетки</div>
        <div class="tab" onclick="showCategory('underwear')">👙 Труси</div>
    </div>

    <div class="container">
        <h2 id="category-title">Шкарпетки</h2>
        <div id="products" style="display: flex; flex-wrap: wrap; justify-content: center;"></div>
    </div>

    <script>
        function showCategory(cat) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.currentTarget.classList.add('active');
            
            document.getElementById('category-title').textContent = cat === 'socks' ? '🧦 Шкарпетки' : '👙 Труси';
            
            const container = document.getElementById('products');
            container.innerHTML = '';

            if (cat === 'socks') {
                container.innerHTML = `
                    <div class="product">
                        <img src="socks1.jpg" alt="Чоловічі спортивні шкарпетки">
                        <h3>Шкарпетки чоловічі спортивні (Туреччина)</h3>
                        <p>Без шва • Adidas стиль • 41-44 • Чорний</p>
                        <p><strong>55 грн / пара</strong></p>
                        <button onclick="alert('Додано в кошик!')">Купити</button>
                    </div>`;
            } else {
                container.innerHTML = `
                    <div class="product">
                        <img src="trusiki1.jpg" alt="Жіночі трусики">
                        <h3>Жіночі трусики</h3>
                        <p><strong>449 грн</strong></p>
                        <button onclick="alert('Додано в кошик!')">Купити</button>
                    </div>`;
            }
        }

        // Показати шкарпетки при завантаженні
        showCategory('socks');
    </script>
</body>
</html>
