<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shkarpetky & Труси</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f8f9fa; }
        header { background: linear-gradient(135deg, #ff6b6b, #4ecdc4); color: white; padding: 25px; text-align: center; }
        .tabs { display: flex; justify-content: center; background: white; padding: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .tab { padding: 12px 35px; margin: 0 8px; border-radius: 50px; cursor: pointer; font-weight: bold; }
        .tab.active { background: #ff4757; color: white; }

        .products { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; padding: 20px; }
        .product { background: white; border-radius: 16px; padding: 15px; width: 320px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); text-align: center; }
        .product img { width: 100%; height: 240px; object-fit: contain; border-radius: 12px; }
        button { border: none; padding: 12px 25px; border-radius: 8px; cursor: pointer; font-size: 16px; }
    </style>
</head>
<body>
    <header>
        <h1>🧦 Шкарпетки & Труси</h1>
        <p>Якісна білизна</p>
    </header>

    <div class="tabs">
        <div class="tab active" onclick="showCategory('socks')">🧦 Шкарпетки</div>
        <div class="tab" onclick="showCategory('underwear')">👙 Труси</div>
    </div>

    <div class="products" id="products"></div>

    <script>
        function showCategory(cat) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.currentTarget.classList.add('active');

            const container = document.getElementById('products');
            container.innerHTML = '';

            if (cat === 'socks') {
                container.innerHTML = `
                    <div class="product">
                        <img src="socks1.jpg" alt="Шкарпетки 1">
                        <h3>Шкарпетки чоловічі спортивні</h3>
                        <p><strong>55 грн</strong></p>
                        <button onclick="alert('Додано в кошик!')">Купити</button>
                    </div>
                    <div class="product">
                        <img src="socks2.jpg" alt="Шкарпетки 2">
                        <h3>Шкарпетки чоловічі спортивні 2</h3>
                        <p><strong>55 грн</strong></p>
                        <button onclick="alert('Додано в кошик!')">Купити</button>
                    </div>`;
            } else {
                container.innerHTML = `
                    <div class="product">
                        <img src="trusiki1.jpg" alt="Трусики 1">
                        <h3>Жіночі трусики</h3>
                        <p><strong>449 грн</strong></p>
                        <button onclick="alert('Додано в кошик!')">Купити</button>
                    </div>
                    <div class="product">
                        <img src="trusiki2.jpg" alt="Трусики 2">
                        <h3>Жіночі трусики (висока посадка)</h3>
                        <p><strong>479 грн</strong></p>
                        <button onclick="alert('Додано в кошик!')">Купити</button>
                    </div>`;
            }
        }

        showCategory('socks');
    </script>
</body>
</html>
